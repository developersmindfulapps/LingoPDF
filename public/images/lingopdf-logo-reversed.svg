    <text x="4" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" letter-spacing="6.5" opacity="0.85">
